stages:
  - quality
  - test
  - build
  - deploy
  - audit

image: node:22

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

before_script:
  - npm ci

lint:
  stage: quality
  script:
    - npm run lint

format:
  stage: quality
  script:
    - npx prettier --check .

test:
  stage: test
  script:
    - npm test -- --run

build:
  stage: build
  needs:
    - lint
    - format
    - test
  script:
    - npm run build:cf
  artifacts:
    paths:
      - .open-next/
    expire_in: 1 day

deploy:
  stage: deploy
  needs:
    - job: build
      artifacts: true
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - if: '$CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - npm run deploy:cf

preview:
  stage: deploy
  needs:
    - job: build
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    # Captura o URL de preview retornado pelo Wrangler e guarda num ficheiro .env
    - npx wrangler pages deploy .open-next/ --project-name="tdw-mp1-mariana-tavares" --branch="mr-$CI_MERGE_REQUEST_IID" > wrangler_output.txt
    - cat wrangler_output.txt
    - PREVIEW_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' wrangler_output.txt | head -n 1)
    - echo "PREVIEW_URL=$PREVIEW_URL" >> preview.env
  artifacts:
    reports:
      dotenv: preview.env

lighthouse:
  stage: audit
  needs:
    - job: preview
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - npm install -g @lhci/cli@0.14.x
    - apt-get update && apt-get install -y chromium
  script:
    # Corre a auditoria no URL de preview dinâmico
    - lhci collect --url="$PREVIEW_URL"
    # Faz o upload e envia os comentários/pontuação para o Merge Request
    - lhci upload
  variables:
    CHROME_PATH: "/usr/bin/chromium"
