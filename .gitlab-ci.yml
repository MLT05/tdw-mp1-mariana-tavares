stages:
  - quality
  - test
  - build
  - deploy

image: node:22

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

# Prepara a cache antes de cada job
before_script:
  - npm ci

lint:
  stage: quality
  script:
    - npm run lint

format:
  stage: quality
  script:
    - npx prettier --check .github/workflows/ci.yml tests/HelloWorld.jsx tests/HelloWorld.test.jsx tests/helpers.js tests/helpers.test.js vitest.config.js

test:
  stage: test
  script:
    - npm test -- --run

build:
  stage: build
  needs:
    - lint
    - format
    - test
  variables:
    CONTENTFUL_SPACE_ID: "$CONTENTFUL_SPACE_ID"
    CONTENTFUL_ACCESS_TOKEN: "$CONTENTFUL_ACCESS_TOKEN"
    CONTENTFUL_PREVIEW_ACCESS_TOKEN: "$CONTENTFUL_PREVIEW_ACCESS_TOKEN"
  script:
    - npm run build:cf
  artifacts:
    paths:
      - .open-next/
    expire_in: 1 day

# Deploy de Produção (Apenas na Branch Principal, Webhooks do CMS ou Cron)
deploy:
  stage: deploy
  needs:
    - job: build
      artifacts: true
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  variables:
    CONTENTFUL_SPACE_ID: "$CONTENTFUL_SPACE_ID"
    CONTENTFUL_ACCESS_TOKEN: "$CONTENTFUL_ACCESS_TOKEN"
    CLOUDFLARE_API_TOKEN: "$CLOUDFLARE_API_TOKEN"
    CLOUDFLARE_ACCOUNT_ID: "$CLOUDFLARE_ACCOUNT_ID"
  script:
    - npx opennextjs-cloudflare deploy

# Preview Deployment para Merge Requests
preview:
  stage: deploy
  needs:
    - job: build
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    CONTENTFUL_SPACE_ID: "$CONTENTFUL_SPACE_ID"
    CONTENTFUL_ACCESS_TOKEN: "$CONTENTFUL_ACCESS_TOKEN"
    CLOUDFLARE_API_TOKEN: "$CLOUDFLARE_API_TOKEN"
    CLOUDFLARE_ACCOUNT_ID: "$CLOUDFLARE_ACCOUNT_ID"
  script:
    - npx wrangler pages deploy .open-next/ --branch="mr-$CI_MERGE_REQUEST_IID"
